# Builds the bundled whisper.cpp / llama.cpp programs on every release platform,
# downloads small real models with the app's own download code and runs them
# through the app's own launch and request code.
name: Local AI runtimes

on:
  pull_request:
    paths:
      - 'scripts/build-runtimes.mjs'
      - 'scripts/runtimes.json'
      - 'src/main/local-ai/**'
      - 'src/shared/local-ai/**'
      - '.github/workflows/local-runtimes.yml'
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Every catalog model resolves on Hugging Face
        env:
          LOCAL_AI_CHECK_CATALOG: '1'
        run: npx vitest run src/main/local-ai/__tests__/catalog.online.test.ts

  smoke:
    name: smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU build, as on Intel Macs and Linux source builds
          - label: ubuntu-latest
            os: ubuntu-latest
          # Vulkan build: the backend must load and the CPU fallback work without a GPU.
          # (Mesa's software Vulkan device is far too slow to transcribe within the timeouts.)
          - label: ubuntu-latest-vulkan
            os: ubuntu-latest
            vulkan: true
          # Metal build; the runner has no usable Metal, so models run on the CPU
          - label: macos-latest
            os: macos-latest
          # Intel Mac build (CPU backends), as shipped in the x64 .dmg
          - label: macos-15-intel
            os: macos-15-intel
          # The release build (with Vulkan); the runner has no GPU, so this is the CPU fallback
          - label: windows-2022
            os: windows-2022
            vulkan: true
    runs-on: ${{ matrix.os }}
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Vulkan build tools
        if: matrix.vulkan && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers

      # The full LunarG SDK, as llama.cpp's CI installs it: ggml's Vulkan backend also
      # needs the SDK's SPIRV-Headers CMake package. The installer is cached: LunarG's server
      # sometimes slows to a few KB/s (the first v1.2.0 release stalled on it for 95 minutes)
      - name: Restore Vulkan SDK installer
        id: vulkan-cache
        if: matrix.vulkan && runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: vulkan-sdk-windows-${{ env.VULKAN_VERSION }}

      - name: Install Vulkan SDK
        if: matrix.vulkan && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan-sdk\VulkanSDK-Installer.exe"
          if (-not (Test-Path $installer)) {
            New-Item -ItemType Directory -Force (Split-Path $installer) | Out-Null
            # Give up on an attempt that stays under 1 MB/s for 30 s and retry, rather than
            # crawl for hours and then run a truncated installer
            curl.exe --fail --silent --show-error --location --retry 5 --retry-delay 15 --retry-all-errors `
              --speed-limit 1048576 --speed-time 30 -o $installer `
              "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
            if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed (curl exit code $LASTEXITCODE)" }
          }
          & $installer --accept-licenses --default-answer --confirm-command install
          if (-not (Test-Path "C:\VulkanSDK\$env:VULKAN_VERSION")) { throw "Vulkan SDK $env:VULKAN_VERSION did not install" }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      # Saved straight after a good install, so a later failure in the job still keeps it
      - name: Save Vulkan SDK installer
        if: matrix.vulkan && runner.os == 'Windows' && steps.vulkan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          key: ${{ steps.vulkan-cache.outputs.cache-primary-key }}

      - name: Build local AI runtimes
        run: npm run build:runtimes -- ${{ matrix.vulkan && '--vulkan' || '' }}

      - name: Download models, transcribe (Whisper, Parakeet, Qwen3-ASR) and chat
        env:
          LOCAL_AI_SMOKE_DOWNLOAD: '1'
          LOCAL_AI_SMOKE_EXPECT_TEXT: '1'
        run: npx vitest run src/main/local-ai/__tests__/runtimes.smoke.test.ts
