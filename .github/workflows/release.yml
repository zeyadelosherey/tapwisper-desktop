# Build and publish macOS + Windows release when a version tag is pushed (e.g. v1.0.0)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac-arm64:
    runs-on: macos-latest # Apple Silicon (arm64)
    env:
      npm_config_arch: arm64
      npm_config_target_arch: arm64
      npm_config_target_platform: darwin
      npm_config_runtime: electron
    steps:
      - uses: actions/checkout@v4

      - name: Verify host architecture is arm64
        run: |
          set -e
          HOST_ARCH=$(uname -m)
          echo "Host arch: $HOST_ARCH"
          if [ "$HOST_ARCH" != "arm64" ]; then
            echo "::error::Expected arm64 host runner, got $HOST_ARCH"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 app
        run: npx electron-vite build && npx electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native module architecture (arm64)
        run: bash scripts/verify-app-arch.sh dist/mac-arm64 arm64

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            dist/*-arm64.dmg
            dist/*-arm64-mac.zip
          retention-days: 1
          if-no-files-found: error

  release-mac-x64:
    runs-on: macos-15-large # Intel x86_64
    env:
      npm_config_arch: x64
      npm_config_target_arch: x64
      npm_config_target_platform: darwin
      npm_config_runtime: electron
    steps:
      - uses: actions/checkout@v4

      - name: Verify host architecture is x86_64
        run: |
          set -e
          HOST_ARCH=$(uname -m)
          echo "Host arch: $HOST_ARCH"
          if [ "$HOST_ARCH" != "x86_64" ]; then
            echo "::error::Expected x86_64 host runner, got $HOST_ARCH"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS x64 app
        run: npx electron-vite build && npx electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native module architecture (x64)
        run: bash scripts/verify-app-arch.sh dist/mac x64

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: |
            dist/*-x64.dmg
            dist/*-x64-mac.zip
          retention-days: 1
          if-no-files-found: error

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
          retention-days: 1
          if-no-files-found: error

  create-release:
    needs: [release-mac-arm64, release-mac-x64, release-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: macos-artifacts

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-artifacts
          path: macos-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts

      - name: List downloaded files
        run: |
          echo "=== macOS artifacts ==="
          find macos-artifacts -type f
          echo "=== Windows artifacts ==="
          find windows-artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TapWisper ${{ github.ref_name }}
          files: |
            macos-artifacts/*
            windows-artifacts/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
