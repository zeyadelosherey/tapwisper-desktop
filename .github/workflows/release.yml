# Build and publish macOS + Windows release when a version tag is pushed (e.g. v1.0.0),
# or a publish/v1.0.0 branch, for when tags can't be pushed: the release then creates the tag.
# A publish/v1.0.0+<anything> branch runs the same release again (e.g. after a failed run).
name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'publish/v*'

permissions:
  contents: write

jobs:
  release-mac-arm64:
    runs-on: macos-latest # Apple Silicon (arm64) -- free runner
    steps:
      - uses: actions/checkout@v4

      - name: Verify host architecture is arm64
        run: |
          set -e
          HOST_ARCH=$(uname -m)
          echo "Host arch: $HOST_ARCH"
          if [ "$HOST_ARCH" != "arm64" ]; then
            echo "::error::Expected arm64 host runner, got $HOST_ARCH"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # whisper.cpp / llama.cpp servers for the Local engine (scripts/build-runtimes.mjs)
      - name: Cache local AI runtimes
        uses: actions/cache@v4
        with:
          path: |
            resources/bin/whisper
            resources/bin/llama
          key: runtimes-${{ runner.os }}-arm64-${{ hashFiles('scripts/runtimes.json', 'scripts/build-runtimes.mjs') }}

      - name: Build local AI runtimes
        run: npm run build:runtimes

      - name: Build macOS arm64 app
        run: npx electron-vite build && npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native module architecture (arm64)
        run: bash scripts/verify-app-arch.sh dist/mac-arm64 arm64

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: |
            dist/*-arm64.dmg
            dist/*-arm64-mac.zip
          retention-days: 1
          if-no-files-found: error

  release-mac-x64:
    # Free Intel x86_64 runner. GitHub retired macos-13 in December 2025; jobs asking for
    # it wait for a runner that never comes (the v1.1.3 and v1.1.4 releases stalled on it).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Verify host architecture is x86_64
        run: |
          set -e
          HOST_ARCH=$(uname -m)
          echo "Host arch: $HOST_ARCH"
          if [ "$HOST_ARCH" != "x86_64" ]; then
            echo "::error::Expected x86_64 host runner, got $HOST_ARCH"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # whisper.cpp / llama.cpp servers for the Local engine (scripts/build-runtimes.mjs)
      - name: Cache local AI runtimes
        uses: actions/cache@v4
        with:
          path: |
            resources/bin/whisper
            resources/bin/llama
          key: runtimes-${{ runner.os }}-x64-${{ hashFiles('scripts/runtimes.json', 'scripts/build-runtimes.mjs') }}

      - name: Build local AI runtimes
        run: npm run build:runtimes

      - name: Build macOS x64 app
        run: npx electron-vite build && npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native module architecture (x64)
        run: bash scripts/verify-app-arch.sh dist/mac x64

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: |
            dist/*-x64.dmg
            dist/*-x64-mac.zip
          retention-days: 1
          if-no-files-found: error

  release-win:
    # Pin to windows-2022 explicitly. windows-latest currently rolls toward
    # windows-2025/vs2026 which the node-gyp version bundled by @electron/rebuild
    # cannot detect -- get-windows then fails to rebuild with "Could not find
    # any Visual Studio installation to use".
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Vulkan backend lets every runtime use NVIDIA, AMD and Intel Arc GPUs
      - name: Install Vulkan SDK
        timeout-minutes: 20
        uses: ./.github/actions/install-vulkan-sdk

      # whisper.cpp / llama.cpp servers for the Local engine (scripts/build-runtimes.mjs)
      - name: Cache local AI runtimes
        uses: actions/cache@v4
        with:
          path: |
            resources/bin/whisper
            resources/bin/llama
          key: runtimes-${{ runner.os }}-x64-${{ hashFiles('scripts/runtimes.json', 'scripts/build-runtimes.mjs') }}

      - name: Build local AI runtimes
        run: npm run build:runtimes -- --vulkan

      - name: Build Windows app
        run: npm run dist:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
          retention-days: 1
          if-no-files-found: error

  create-release:
    needs: [release-mac-arm64, release-mac-x64, release-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: macos-artifacts

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-artifacts
          path: macos-artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: windows-artifacts

      - name: List downloaded files
        run: |
          echo "=== macOS artifacts ==="
          find macos-artifacts -type f
          echo "=== Windows artifacts ==="
          find windows-artifacts -type f

      - name: Release tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#publish/}"
          TAG="${TAG%%+*}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TapWisper ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            macos-artifacts/*
            windows-artifacts/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
